---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%B %d, %Y" }}
      </time>
      {% if page.author %} • {{ page.author }}{% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.tags %}
  <div class="post-tags">
    <strong>Tags:</strong>
    {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
    {% endfor %}
  </div>
  {% endif %}
</article>

<style>
  .post-header {
    margin-bottom: 2rem;
  }

  .post-title {
    font-size: 2.5rem;
    font-weight: 400;
    margin: 0 0 0.5rem 0;
    color: #1a1a1a;
  }

  .post-meta {
    color: #666;
    font-size: 0.9rem;
    margin: 0;
  }

  .post-content {
    margin-bottom: 2rem;
  }

  .post-content h2 {
    margin-top: 2rem;
    font-size: 1.8rem;
    font-weight: 400;
  }

  .post-content h3 {
    margin-top: 1.5rem;
    font-size: 1.4rem;
    font-weight: 400;
  }

  .post-content img {
    max-width: 100%;
    height: auto;
    margin: 1rem 0;
  }

  .post-content pre {
    background: #f5f5f5;
    padding: 1rem;
    overflow-x: auto;
    border-radius: 4px;
  }

  .post-content code {
    background: #f5f5f5;
    padding: 0.2rem 0.4rem;
    border-radius: 3px;
    font-size: 0.9em;
  }

  .post-content pre code {
    background: none;
    padding: 0;
  }

  .post-tags {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid #e0e0e0;
  }

  .tag {
    display: inline-block;
    background: #f0f0f0;
    padding: 0.2rem 0.6rem;
    margin-right: 0.5rem;
    border-radius: 3px;
    font-size: 0.9rem;
    color: #555;
  }

  @media (max-width: 600px) {
    .post-title {
      font-size: 1.8rem;
    }
  }
</style>
